<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro – WayPath</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/shared.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/accesibilidad.css">
    <link rel="stylesheet" href="css/auth-integration.css">
</head>
<body class="auth-body">
<div class="accessibility-widget">
    <button id="btn-aumentar-texto" title="Texto grande"><i class="fa-solid fa-plus"></i></button>
    <button id="btn-reducir-texto"  title="Texto normal"><i class="fa-solid fa-minus"></i></button>
    <button id="btn-alto-contraste" title="Modo oscuro"><i class="fa-solid fa-moon"></i></button>
</div>
<div id="google_translate_element" class="traductor-widget"></div>

<div class="auth-container">
    <div class="auth-panel">
        <div class="auth-header">
            <a href="index.html" class="wp-logo" style="margin:0 auto 16px;">Way<span class="accent">Path</span></a>
            <h2 data-i18n="register.title">Crea tu cuenta</h2>
            <p data-i18n="register.subtitle">Únete a WayPath y empieza a explorar el Perú.</p>
        </div>
        <form class="auth-form" id="registerForm">
            <div class="form-field">
                <label for="name" data-i18n="register.name">Nombre completo</label>
<input type="text" id="name" class="wp-input" placeholder="Tu nombre" data-i18n-placeholder="register.namePlaceholder" required maxlength="100" autocomplete="name">
            </div>
            <div class="form-field">
                <label for="email" data-i18n="auth.email">Correo electrónico</label>
<input type="email" id="email" class="wp-input" placeholder="tu@correo.com" required maxlength="255" autocomplete="username">
            </div>
            <div class="form-field">
                <label for="password" data-i18n="auth.password">Contraseña</label>
<input type="password" id="password" class="wp-input" placeholder="Mínimo 12 caracteres" data-i18n-placeholder="register.passwordPlaceholder" required minlength="12" maxlength="128" autocomplete="new-password">
                <div class="password-strength" id="passwordStrength" aria-live="polite">
                    <span></span>
                    <small data-i18n="register.passwordHint">Mínimo 12 caracteres y 4 caracteres especiales.</small>
                </div>
            </div>
            <div class="form-field">
                <label for="confirmPassword" data-i18n="register.confirmPassword">Confirmar contraseña</label>
<input type="password" id="confirmPassword" class="wp-input" placeholder="Repite tu contraseña" data-i18n-placeholder="register.confirmPlaceholder" required minlength="12" maxlength="128" autocomplete="new-password">
            </div>
            <p id="authMessage" role="status" aria-live="polite"></p>
            <button type="submit" class="wp-btn wp-btn-primary" style="width:100%;justify-content:center;" data-i18n="register.submit">Registrarse</button>
        </form>
        <div class="auth-footer">
            <p><span data-i18n="register.haveAccount">¿Ya tienes una cuenta?</span> <a href="login.html" data-i18n="login.submit">Inicia sesión</a></p>
        </div>
    </div>
</div>

<script src="js/accesibilidad.js"></script>
<script type="module" src="js/registro.js"></script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
